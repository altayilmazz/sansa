<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Şansa</title>
    <meta name="description" content="Takımları, sırayı ve küçük kararları saniyeler içinde şansa bırak. Takım oluştur, çark çevir, kura çek, yazı tura, zar ve kart." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Şansa" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      // İlk boyamadan önce kayıtlı temayı uygula; sayfa açılırken renk titremesin.
      try {
        var p = (JSON.parse(localStorage.getItem("sansa:v1:settings")) || {}).theme;
        var dark = matchMedia("(prefers-color-scheme: dark)").matches;
        var t = p === "acik" ? "light" : p === "koyu" ? "dark" : p === "ozel" ? "special" : dark ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Şansa’yı kullanmak için JavaScript’i etkinleştir.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
